services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    # --algorithm mld tiene que coincidir con osrm-partition/osrm-customize del script.
    # --max-trip-size limita el endpoint /trip, que es el que usa el cálculo marginal.
    # --max-table-size limita el endpoint /table.
    command: >
      osrm-routed
      --algorithm mld
      --max-trip-size 60
      --max-table-size 200
      /data/tucuman.osrm
    volumes:
      - /opt/osrm-datos:/data:ro
    restart: unless-stopped
    # Tope duro de memoria: si algo se desmadra, muere el contenedor y no el VPS.
    # El grafo de Tucumán recortado debería usar bastante menos; el resto es margen.
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 256M
    # La imagen es Debian slim y no trae wget/curl: se prueba el puerto por TCP con bash.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Sin `ports:` a propósito: el motor no se expone a internet.
    # El backend lo alcanza por la red overlay de Dokploy con el alias único
    # `osrm-tucuman` (http://osrm-tucuman:5000). El alias evita colisiones de nombre
    # con otros servicios llamados `osrm` en la misma red.
    networks:
      dokploy-network:
        aliases:
          - osrm-tucuman

networks:
  dokploy-network:
    external: true
